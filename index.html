<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASO Parsel Sorgu Paneli</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Calibri,"Segoe UI",Arial,sans-serif;font-size:13px;color:#1a1a1a;background:#f2f4f7}
header{background:#1F4E79;color:#fff;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.3px}
header .sub{font-size:12px;color:#cfe0f0}
#wrap{display:grid;grid-template-columns:260px 1fr 380px;gap:10px;padding:10px;align-items:start}
.card{background:#fff;border:1px solid #c9d3dd;border-radius:3px}
.card h2{font-size:12px;margin:0;padding:6px 10px;background:#2E75B6;color:#fff;font-weight:700;letter-spacing:.2px}
.card .body{padding:8px 10px}
label.fl{display:block;font-weight:700;margin:8px 0 3px;color:#1F4E79;font-size:12px}
input[type=text],input[type=number],select{width:100%;padding:4px 6px;border:1px solid #a6b3c0;border-radius:2px;font-family:inherit;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid #a6b3c0;background:#fff;border-radius:2px;padding:3px 9px;cursor:pointer;font-size:12px;user-select:none}
.chip.on{background:#1F4E79;border-color:#1F4E79;color:#fff;font-weight:700}
.row2{display:flex;gap:6px}
#firmaList{max-height:190px;overflow:auto;border:1px solid #a6b3c0;margin-top:4px;background:#fff}
#firmaList div{padding:3px 6px;cursor:pointer;border-bottom:1px solid #eef1f4;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#firmaList div.on{background:#DCE6F1;font-weight:700}
#firmaList div:hover{background:#eef3f9}
button.btn{background:#1F4E79;color:#fff;border:0;padding:5px 10px;border-radius:2px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:700}
button.btn.sec{background:#7f8c99}
#mapbox{position:relative;background:#fff;height:calc(100vh - 110px);min-height:520px;overflow:hidden}
svg#map{width:100%;height:100%;display:block;cursor:grab;background:#fbfcfd}
svg#map path{stroke:#8a939c;stroke-width:1.2;vector-effect:non-scaling-stroke;cursor:pointer}
svg#map path.dim{fill:#e3e6ea}
svg#map path.sel{stroke:#000;stroke-width:2.2}
#tip{position:absolute;pointer-events:none;background:#1F4E79;color:#fff;padding:5px 8px;border-radius:2px;font-size:12px;display:none;max-width:280px;z-index:5;line-height:1.35}
#mapTools{position:absolute;top:8px;right:8px;display:flex;gap:4px;flex-direction:column;z-index:4}
#mapTools button{width:26px;height:26px;border:1px solid #a6b3c0;background:#fff;cursor:pointer;font-size:14px;font-weight:700;border-radius:2px}
#legend{position:absolute;bottom:8px;left:8px;background:rgba(255,255,255,.93);border:1px solid #c9d3dd;padding:6px 8px;font-size:11px;z-index:4;border-radius:2px}
#legend span.sw{display:inline-block;width:11px;height:11px;margin-right:4px;border:1px solid #6b7580;vertical-align:-1px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;padding:8px 10px}
.kpi{background:#DCE6F1;border:1px solid #b8cce4;padding:6px 8px;border-radius:2px}
.kpi b{display:block;font-size:17px;color:#1F4E79}
.kpi span{font-size:11px;color:#44546A;font-weight:700}
table.sum{width:100%;border-collapse:collapse;font-size:12px}
table.sum th,table.sum td{border:1px solid #b8cce4;padding:2px 5px;text-align:right}
table.sum th{background:#1F4E79;color:#fff;font-weight:700;text-align:center}
table.sum td:first-child,table.sum th:first-child{text-align:left}
table.sum tr.tot td{background:#DCE6F1;font-weight:700}
#detay{font-size:12px}
#detay table{width:100%;border-collapse:collapse}
#detay td{border-bottom:1px solid #e6eaee;padding:2px 4px}
#detay td:first-child{color:#44546A;font-weight:700;width:42%}
#liste{max-height:260px;overflow:auto}
#liste table{width:100%;border-collapse:collapse;font-size:12px}
#liste th{position:sticky;top:0;background:#2E75B6;color:#fff;padding:3px 5px;text-align:left;cursor:pointer}
#liste td{border-bottom:1px solid #eef1f4;padding:2px 5px}
#liste tr:hover td{background:#eef3f9;cursor:pointer}
#liste tr.on td{background:#DCE6F1}
.right{text-align:right}
#tabs{display:none;gap:0;background:#173f63;position:sticky;top:0;z-index:20}
#tabs button{flex:1;padding:10px 4px;border:0;background:#173f63;color:#b9cde0;font:700 13px Calibri,Arial;cursor:pointer;border-bottom:3px solid transparent}
#tabs button.on{color:#fff;border-bottom-color:#8eb4e3;background:#1F4E79}
@media(max-width:1100px){
  #wrap{grid-template-columns:1fr;padding:6px;gap:6px}
  #tabs{display:flex}
  header h1{font-size:14px}
  body.m-filtre #colHarita,body.m-filtre #colOzet{display:none}
  body.m-harita #colFiltre,body.m-harita #colOzet{display:none}
  body.m-ozet #colFiltre,body.m-ozet #colHarita{display:none}
  #mapbox{height:calc(100vh - 150px);min-height:340px}
  #liste{max-height:none}
  .chip{padding:6px 12px;font-size:13px}
  input[type=text],input[type=number],select{padding:7px 8px;font-size:15px}
  #firmaList{max-height:230px}
  #firmaList div{padding:7px 6px;font-size:13px}
  button.btn{padding:9px 12px;font-size:13px}
  .kpis{grid-template-columns:1fr 1fr}
  table.sum{font-size:11px}
  table.sum th,table.sum td{padding:3px 3px}
}
</style>
</head>
<body>
<header>
  <h1>ASO 1. OSB 7. KISIM &mdash; PARSEL SORGU PANELİ</h1>
  <span class="sub" id="hsub"></span>
</header>
<div id="tabs">
  <button data-t="filtre">FİLTRE</button><button data-t="harita" class="on">HARİTA</button><button data-t="ozet">ÖZET</button>
</div>
<div id="wrap">

  <div id="colFiltre">
    <div class="card">
      <h2>FİLTRELER</h2>
      <div class="body">
        <label class="fl">PARSEL ADI / KOD</label>
        <input type="text" id="fAd" placeholder="örn. C10, D9, ASO-075">

        <label class="fl">BÖLGE</label>
        <div class="chips" id="fBolge"></div>

        <label class="fl">TÜR</label>
        <div class="chips" id="fTur"></div>

        <label class="fl">SAHİPLİK</label>
        <div class="chips" id="fSahip"></div>

        <label class="fl">ALAN (m²)</label>
        <div class="row2">
          <input type="number" id="fAlanMin" placeholder="min">
          <input type="number" id="fAlanMax" placeholder="max">
        </div>

        <label class="fl">FİRMA ADI</label>
        <input type="text" id="fFirmaAra" placeholder="firma ara...">
        <div id="firmaList"></div>

        <label class="fl">RENKLENDİRME</label>
        <select id="fRenk">
          <option value="tur">TÜR'e göre</option>
          <option value="sahiplik">SAHİPLİK'e göre (dolu/boş)</option>
          <option value="bolge">BÖLGE'ye göre</option>
          <option value="tek">Tek renk (vurgu)</option>
        </select>

        <div style="margin-top:10px;display:flex;gap:6px">
          <button class="btn" id="btnCsv">CSV</button>
          <button class="btn sec" id="btnTemiz">TEMİZLE</button>
        </div>
      </div>
    </div>
    <div class="card" style="margin-top:8px">
      <h2>VERİ YÖNETİMİ</h2>
      <div class="body">
        <button class="btn sec" id="btnSablon" style="width:100%">1 &nbsp;ŞABLON CSV İNDİR</button>
        <button class="btn" id="btnYukle" style="width:100%;margin-top:5px">2 &nbsp;GÜNCEL CSV YÜKLE</button>
        <input type="file" id="fileCsv" accept=".csv,.txt" style="display:none">
        <button class="btn" id="btnKaydet" style="width:100%;margin-top:5px;background:#548235">3 &nbsp;PANELİ KAYDET (HTML)</button>
        <div id="yukMsg" style="font-size:11px;color:#548235;margin-top:5px;font-weight:700"></div>
      </div>
    </div>
  </div>

  <div class="card" id="colHarita" style="padding:0">
    <h2>HARİTA</h2>
    <div id="mapbox">
      <svg id="map"><g id="gz"></g></svg>
      <div id="tip"></div>
      <div id="mapTools">
        <button id="zin" title="Yakınlaştır">+</button>
        <button id="zout" title="Uzaklaştır">&minus;</button>
        <button id="zfit" title="Sığdır">⤢</button>
      </div>
      <div id="legend"></div>
    </div>
  </div>

  <div id="colOzet">
    <div class="card">
      <h2>SONUÇ ÖZETİ</h2>
      <div class="kpis" id="kpis"></div>
    </div>
    <div class="card" style="margin-top:8px">
      <h2>ADET / ALAN BAZINDA PARSEL DURUMU</h2>
      <div class="body"><table class="sum" id="tblDurum"></table></div>
    </div>
    <div class="card" style="margin-top:8px">
      <h2>KUZEY - GÜNEY DAĞILIMI</h2>
      <div class="body"><table class="sum" id="tblBolge"></table></div>
    </div>
    <div class="card" style="margin-top:8px">
      <h2>SEÇİLİ PARSEL</h2>
      <div class="body" id="detay">Haritadan veya listeden parsel seçin.</div>
    </div>
    <div class="card" style="margin-top:8px">
      <h2>SONUÇ LİSTESİ (<span id="lstN">0</span>)</h2>
      <div id="liste"></div>
    </div>
  </div>
</div>

<script>
const DATA=JSON.parse(document.getElementById('veri').textContent);
const P=DATA.parseller;
const TUR_RENK={A:'#C00000',C:'#1F4E79',D:'#2E75B6',E:'#548235',F:'#BF8F00',G:'#7030A0',H:'#E36C0A'};
const SAH_RENK={'DOLU':'#1F4E79','BOŞ':'#A6A6A6'};
const BOL_RENK={'KUZEY':'#1F4E79','GÜNEY':'#C55A11'};
const TEK='#2E75B6';
const nf=n=>n==null?'':n.toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});
const nf0=n=>n==null?'':n.toLocaleString('tr-TR');
const F={ad:'',bolge:new Set(),tur:new Set(),sahiplik:new Set(),firma:new Set(),amin:null,amax:null};
let SEC=null;

// ---- filtre kutularini doldur
const uniq=(k)=>[...new Set(P.map(p=>p[k]).filter(v=>v!=null))].sort((a,b)=>String(a).localeCompare(String(b),'tr'));
function chips(el,vals,set){
  el.innerHTML='';
  vals.forEach(v=>{const d=document.createElement('div');d.className='chip';d.textContent=v;
    d.onclick=()=>{set.has(v)?set.delete(v):set.add(v);d.classList.toggle('on');uygula();};
    el.appendChild(d);});
}
chips(document.getElementById('fBolge'),uniq('bolge'),F.bolge);
chips(document.getElementById('fTur'),uniq('tur'),F.tur);
chips(document.getElementById('fSahip'),uniq('sahiplik'),F.sahiplik);

const FIRMALAR=uniq('firma');
function firmaCiz(){
  const q=document.getElementById('fFirmaAra').value.toLocaleUpperCase('tr');
  const box=document.getElementById('firmaList');box.innerHTML='';
  FIRMALAR.filter(f=>f.toLocaleUpperCase('tr').includes(q)).forEach(f=>{
    const d=document.createElement('div');d.textContent=f;d.title=f;
    if(F.firma.has(f))d.className='on';
    d.onclick=()=>{F.firma.has(f)?F.firma.delete(f):F.firma.add(f);firmaCiz();uygula();};
    box.appendChild(d);
  });
}
firmaCiz();
document.getElementById('fFirmaAra').oninput=firmaCiz;
document.getElementById('fAd').oninput=e=>{F.ad=e.target.value.toLocaleUpperCase('tr').trim();uygula();};
document.getElementById('fAlanMin').oninput=e=>{F.amin=e.target.value===''?null:+e.target.value;uygula();};
document.getElementById('fAlanMax').oninput=e=>{F.amax=e.target.value===''?null:+e.target.value;uygula();};
document.getElementById('fRenk').onchange=uygula;
document.getElementById('btnTemiz').onclick=()=>{
  F.ad='';F.bolge.clear();F.tur.clear();F.sahiplik.clear();F.firma.clear();F.amin=null;F.amax=null;
  document.getElementById('fAd').value='';document.getElementById('fAlanMin').value='';
  document.getElementById('fAlanMax').value='';document.getElementById('fFirmaAra').value='';
  document.querySelectorAll('.chip.on').forEach(c=>c.classList.remove('on'));
  firmaCiz();SEC=null;uygula();
};

// ---- harita
const svg=document.getElementById('map'),gz=document.getElementById('gz'),tip=document.getElementById('tip');
svg.setAttribute('viewBox',`0 0 ${DATA.w} ${DATA.h}`);
svg.setAttribute('preserveAspectRatio','xMidYMid meet');
const yol={};
P.forEach(p=>{
  const el=document.createElementNS('http://www.w3.org/2000/svg','path');
  el.setAttribute('d',p.d);el.dataset.cod=p.cod;
  el.addEventListener('mousemove',ev=>{
    const r=document.getElementById('mapbox').getBoundingClientRect();
    tip.style.display='block';
    tip.style.left=Math.min(ev.clientX-r.left+12,r.width-290)+'px';
    tip.style.top=(ev.clientY-r.top+12)+'px';
    tip.innerHTML=`<b>${p.ad||p.cod}</b> (${p.cod})<br>${p.bolge||''} / TÜR ${p.tur||'-'} / ${p.sahiplik||'-'}<br>Alan: ${p.alan?nf(p.alan)+' m²':'-'}<br>${p.firma||''}`;
  });
  el.addEventListener('mouseleave',()=>tip.style.display='none');
  el.addEventListener('click',()=>{SEC=p.cod;detayCiz();boya();listeIsaret();});
  gz.appendChild(el);yol[p.cod]=el;
});
// zoom & pan
let k=1,tx=0,ty=0;
const uyg=()=>gz.setAttribute('transform',`translate(${tx},${ty}) scale(${k})`);
svg.addEventListener('wheel',e=>{e.preventDefault();
  const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
  const loc=pt.matrixTransform(svg.getScreenCTM().inverse());
  const f=e.deltaY<0?1.2:1/1.2;
  tx=loc.x-(loc.x-tx)*f;ty=loc.y-(loc.y-ty)*f;k*=f;uyg();},{passive:false});
let drag=null;
svg.addEventListener('mousedown',e=>{drag={x:e.clientX,y:e.clientY,tx,ty};svg.style.cursor='grabbing';});
window.addEventListener('mouseup',()=>{drag=null;svg.style.cursor='grab';});
window.addEventListener('mousemove',e=>{if(!drag)return;
  const s=DATA.w/svg.getBoundingClientRect().width;
  tx=drag.tx+(e.clientX-drag.x)*s;ty=drag.ty+(e.clientY-drag.y)*s;uyg();});
document.getElementById('zin').onclick=()=>{k*=1.3;uyg();};
document.getElementById('zout').onclick=()=>{k/=1.3;uyg();};
document.getElementById('zfit').onclick=()=>{k=1;tx=0;ty=0;uyg();};

// ---- filtreleme
function gecer(p){
  if(F.ad){const s=(p.ad||'')+' '+p.cod;if(!s.toLocaleUpperCase('tr').includes(F.ad))return false;}
  if(F.bolge.size&&!F.bolge.has(p.bolge))return false;
  if(F.tur.size&&!F.tur.has(p.tur))return false;
  if(F.sahiplik.size&&!F.sahiplik.has(p.sahiplik))return false;
  if(F.firma.size&&!F.firma.has(p.firma))return false;
  if(F.amin!=null&&!(typeof p.alan==='number'&&p.alan>=F.amin))return false;
  if(F.amax!=null&&!(typeof p.alan==='number'&&p.alan<=F.amax))return false;
  return true;
}
let SONUC=[];
function renk(p){
  const m=document.getElementById('fRenk').value;
  if(m==='tur')return TUR_RENK[p.tur]||'#7f8c99';
  if(m==='sahiplik')return SAH_RENK[p.sahiplik]||'#7f8c99';
  if(m==='bolge')return BOL_RENK[p.bolge]||'#7f8c99';
  return TEK;
}
function boya(){
  const set=new Set(SONUC.map(p=>p.cod));
  P.forEach(p=>{const el=yol[p.cod];
    if(set.has(p.cod)){el.classList.remove('dim');el.setAttribute('fill',renk(p));el.setAttribute('fill-opacity',.9);}
    else{el.classList.add('dim');el.setAttribute('fill','#e3e6ea');el.setAttribute('fill-opacity',1);}
    el.classList.toggle('sel',p.cod===SEC);
    if(p.cod===SEC)gz.appendChild(el);
  });
  legend();
}
function legend(){
  const m=document.getElementById('fRenk').value;
  let src=m==='tur'?TUR_RENK:m==='sahiplik'?SAH_RENK:m==='bolge'?BOL_RENK:{'Seçilen':TEK};
  document.getElementById('legend').innerHTML=Object.entries(src)
    .map(([k,v])=>`<span class="sw" style="background:${v}"></span>${k}`).join('&nbsp;&nbsp;')
    +`&nbsp;&nbsp;<span class="sw" style="background:#e3e6ea"></span>kapsam dışı`;
}

// ---- ozet tablolar
function ozet(){
  const turler=uniq('tur');
  let h='<tr><th>TÜR</th><th>BOŞ</th><th>DOLU</th><th>ADET</th><th>ALAN (m²)</th></tr>';
  let tb=0,td=0,ta=0;
  turler.forEach(t=>{
    const g=SONUC.filter(p=>p.tur===t);if(!g.length)return;
    const b=g.filter(p=>p.sahiplik==='BOŞ').length,d=g.filter(p=>p.sahiplik==='DOLU').length;
    const a=g.reduce((s,p)=>s+(typeof p.alan==='number'?p.alan:0),0);
    tb+=b;td+=d;ta+=a;
    h+=`<tr><td>${t}</td><td>${b}</td><td>${d}</td><td>${g.length}</td><td>${nf(a)}</td></tr>`;
  });
  const dig=SONUC.filter(p=>!p.tur);
  if(dig.length){const a=dig.reduce((s,p)=>s+(typeof p.alan==='number'?p.alan:0),0);ta+=a;
    h+=`<tr><td>DİĞER*</td><td>-</td><td>-</td><td>${dig.length}</td><td>${nf(a)}</td></tr>`;}
  h+=`<tr class="tot"><td>TOPLAM</td><td>${tb}</td><td>${td}</td><td>${SONUC.length}</td><td>${nf(ta)}</td></tr>`;
  document.getElementById('tblDurum').innerHTML=h;

  let h2='<tr><th>TÜR</th><th>KUZEY</th><th>GÜNEY</th><th>ADET</th><th>KUZEY ALAN</th><th>GÜNEY ALAN</th></tr>';
  let k1=0,g1=0,ka=0,ga=0;
  const alan=l=>l.reduce((s,p)=>s+(typeof p.alan==='number'?p.alan:0),0);
  [...turler,null].forEach(t=>{
    const g=SONUC.filter(p=>(p.tur||null)===t);if(!g.length)return;
    const K=g.filter(p=>p.bolge==='KUZEY'),G=g.filter(p=>p.bolge==='GÜNEY');
    k1+=K.length;g1+=G.length;ka+=alan(K);ga+=alan(G);
    h2+=`<tr><td>${t||'DİĞER*'}</td><td>${K.length}</td><td>${G.length}</td><td>${g.length}</td><td>${nf(alan(K))}</td><td>${nf(alan(G))}</td></tr>`;
  });
  h2+=`<tr class="tot"><td>TOPLAM</td><td>${k1}</td><td>${g1}</td><td>${SONUC.length}</td><td>${nf(ka)}</td><td>${nf(ga)}</td></tr>`;
  document.getElementById('tblBolge').innerHTML=h2;

  const ta2=SONUC.reduce((s,p)=>s+(typeof p.alan==='number'?p.alan:0),0);
  const dolu=SONUC.filter(p=>p.sahiplik==='DOLU'),bos=SONUC.filter(p=>p.sahiplik==='BOŞ');
  document.getElementById('kpis').innerHTML=
    `<div class="kpi"><span>PARSEL ADEDİ</span><b>${nf0(SONUC.length)}</b></div>
     <div class="kpi"><span>TOPLAM ALAN (m²)</span><b>${nf(ta2)}</b></div>
     <div class="kpi"><span>DOLU / ALAN</span><b>${dolu.length} <small style="font-size:11px">| ${nf(alan(dolu))}</small></b></div>
     <div class="kpi"><span>BOŞ / ALAN</span><b>${bos.length} <small style="font-size:11px">| ${nf(alan(bos))}</small></b></div>`;
  document.getElementById('hsub').textContent=
    `${SONUC.length} / ${P.length} parsel · ${nf(ta2)} m²`;
}

// ---- liste
let sortK='ad',sortD=1;
function listeCiz(){
  const kol=[['ad','PARSEL'],['bolge','BÖLGE'],['tur','TÜR'],['alan','ALAN'],['sahiplik','DURUM'],['firma','FİRMA']];
  const arr=[...SONUC].sort((a,b)=>{
    const x=a[sortK],y=b[sortK];
    if(typeof x==='number'||typeof y==='number')return ((x||0)-(y||0))*sortD;
    return String(x||'').localeCompare(String(y||''),'tr')*sortD;});
  let h='<table><thead><tr>'+kol.map(c=>`<th data-k="${c[0]}">${c[1]}</th>`).join('')+'</tr></thead><tbody>';
  arr.forEach(p=>{h+=`<tr data-cod="${p.cod}" class="${p.cod===SEC?'on':''}"><td>${p.ad||p.cod}</td><td>${p.bolge||''}</td><td>${p.tur||''}</td><td class="right">${typeof p.alan==='number'?nf(p.alan):''}</td><td>${p.sahiplik||''}</td><td title="${(p.firma||'').replace(/"/g,'')}">${(p.firma||'').slice(0,26)}</td></tr>`;});
  h+='</tbody></table>';
  const box=document.getElementById('liste');box.innerHTML=h;
  document.getElementById('lstN').textContent=SONUC.length;
  box.querySelectorAll('th').forEach(th=>th.onclick=()=>{
    const kk=th.dataset.k;sortD=(kk===sortK)?-sortD:1;sortK=kk;listeCiz();});
  box.querySelectorAll('tr[data-cod]').forEach(tr=>tr.onclick=()=>{
    SEC=tr.dataset.cod;detayCiz();boya();listeIsaret();});
}
function listeIsaret(){
  document.querySelectorAll('#liste tr[data-cod]').forEach(tr=>{
    tr.classList.toggle('on',tr.dataset.cod===SEC);
    if(tr.dataset.cod===SEC)tr.scrollIntoView({block:'nearest'});});
}
function detayCiz(){
  const p=P.find(x=>x.cod===SEC);
  if(!p){document.getElementById('detay').textContent='Haritadan veya listeden parsel seçin.';return;}
  const r=[['PARSEL ADI',p.ad],['PARSEL KOD',p.cod],['BÖLGE',p.bolge],['TÜR',p.tur],['SEÇİM',p.secim],
    ['ALAN (m²)',typeof p.alan==='number'?nf(p.alan):p.alan],['SAHİPLİK',p.sahiplik],['FİRMA',p.firma],
    ['MİMARİ',p.mimari],['U. ADASI',p.ada],['U. PARSELİ',p.uparsel],
    ['NİHAİ KOT',p.kot],['İHALE KOTU',p.ihalekot],['PROJE KOTU',p.projekot],['FARK',typeof p.fark==='number'?p.fark.toFixed(2):p.fark],
    ['YOL KOTU',p.yolkot],['T.KAZI',typeof p.kazi==='number'?nf(p.kazi):p.kazi],['T.DOLGU',typeof p.dolgu==='number'?nf(p.dolgu):p.dolgu]];
  document.getElementById('detay').innerHTML='<table>'+r.filter(x=>x[1]!=null&&x[1]!=='')
    .map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('')+'</table>';
}

// ---- VERI YONETIMI ----
const KOL=['cod','ad','bolge','tur','secim','alan','sahiplik','firma','mimari','ada','uparsel','kot','ihalekot','projekot','fark','yolkot','kazi','dolgu'];
const BAS=['PARSEL COD','PARSEL ADI','BÖLGE','TÜR','SEÇİM','ALAN','SAHİPLİK','FİRMA','MİMARİ','U.ADASI','U.PARSELİ','NİHAİ KOT','İHALE KOTU','PROJE KOTU','FARK','YOL KOTU','T.KAZI','T.DOLGU'];
const SAYI=new Set(['alan','kot','ihalekot','projekot','fark','kazi','dolgu']);
function csvYap(liste){
  const sat=s=>KOL.map(k=>{let v=s[k];if(v==null)v='';if(typeof v==='number')v=String(v).replace('.',',');
    return '"'+String(v).replace(/"/g,'""')+'"';}).join(';');
  return '\uFEFF'+BAS.join(';')+'\n'+liste.map(sat).join('\n');
}
function indir(ad,icerik,tip){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([icerik],{type:tip}));a.download=ad;a.click();
}
document.getElementById('btnSablon').onclick=()=>indir('ASO_PARSEL_SABLON.csv',csvYap(P),'text/csv');
document.getElementById('btnYukle').onclick=()=>document.getElementById('fileCsv').click();
document.getElementById('fileCsv').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      let t=rd.result.replace(/^\uFEFF/,'').replace(/\r/g,'');
      const sat=csvParse(t);
      const bas=sat[0].map(x=>x.trim().toLocaleUpperCase('tr'));
      const ci={};BAS.forEach((b,i)=>{const j=bas.indexOf(b.toLocaleUpperCase('tr'));if(j>=0)ci[KOL[i]]=j;});
      if(ci.cod==null)throw new Error('PARSEL COD sütunu bulunamadı');
      const hrt={};P.forEach(p=>hrt[p.cod]=p);
      let gun=0,yok=[];
      for(let i=1;i<sat.length;i++){
        const r=sat[i];if(!r||!r[ci.cod])continue;
        const cod=r[ci.cod].trim();const p=hrt[cod];
        if(!p){yok.push(cod);continue;}
        KOL.forEach(k=>{
          if(k==='cod'||ci[k]==null)return;
          let v=(r[ci[k]]??'').trim();
          if(v===''){p[k]=null;return;}
          if(SAYI.has(k)){const n=parseFloat(v.replace(/\./g,'').replace(',','.'));
            p[k]=isNaN(n)?v:n;}
          else p[k]=v;
        });
        gun++;
      }
      FIRMALAR.length=0;uniq('firma').forEach(x=>FIRMALAR.push(x));
      chips(document.getElementById('fBolge'),uniq('bolge'),F.bolge);
      chips(document.getElementById('fTur'),uniq('tur'),F.tur);
      chips(document.getElementById('fSahip'),uniq('sahiplik'),F.sahiplik);
      F.bolge.clear();F.tur.clear();F.sahiplik.clear();F.firma.clear();
      firmaCiz();SEC=null;detayCiz();uygula();
      document.getElementById('yukMsg').innerHTML=
        gun+' parsel güncellendi.'+(yok.length?'<br><span style="color:#C00000">Eşleşmeyen kod ('+yok.length+'): '+yok.slice(0,5).join(', ')+'</span>':'')
        +'<br>Kalıcı olması için 3. adımı çalıştır.';
    }catch(err){document.getElementById('yukMsg').innerHTML='<span style="color:#C00000">HATA: '+err.message+'</span>';}
  };
  rd.readAsText(f,'utf-8');
  e.target.value='';
};
function csvParse(t){
  const out=[];let sat=[],alan='',tirnak=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(tirnak){ if(c==='"'){ if(t[i+1]==='"'){alan+='"';i++;} else tirnak=false; } else alan+=c; }
    else if(c==='"')tirnak=true;
    else if(c===';'){sat.push(alan);alan='';}
    else if(c==='\n'){sat.push(alan);out.push(sat);sat=[];alan='';}
    else alan+=c;
  }
  if(alan!==''||sat.length){sat.push(alan);out.push(sat);}
  return out.filter(s=>s.length>1||s[0]!=='');
}
document.getElementById('btnKaydet').onclick=()=>{
  const yeni=P.map(p=>{const o={};KOL.forEach(k=>o[k]=p[k]);o.d=p.d;o.c=p.c;return o;});
  const json=JSON.stringify({w:DATA.w,h:DATA.h,parseller:yeni});
  const kok=document.documentElement.cloneNode(true);
  kok.querySelector('#veri').textContent=json;
  kok.querySelector('#yukMsg').textContent='';
  const g=new Date(),pad=n=>String(n).padStart(2,'0');
  indir('ASO_PARSEL_SORGU_PANELI_'+g.getFullYear()+pad(g.getMonth()+1)+pad(g.getDate())+'.html',
    '<!DOCTYPE html>\n'+kok.outerHTML,'text/html');
};
